name: core-pihole
services:
  pihole:
    image: pihole/pihole@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be   # pinned 2026-10-02 (FTL v6.7.1)
    container_name: core-pihole
    hostname: pihole
    restart: unless-stopped
    networks:
      dns: { ipv4_address: 172.25.53.53 }
    ports:
      - "192.168.1.2:53:53/udp"
      - "192.168.1.2:53:53/tcp"
      - "100.64.0.10:53:53/udp"
      - "100.64.0.10:53:53/tcp"
      - "127.0.0.1:8053:80/tcp"          # web UI; Caddy "dns." from 3.8, SSH tunnel until then
    env_file: [ .env ]
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_dns_upstreams: "172.25.53.1#53"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_domainNeeded: "true"
      FTLCONF_dns_bogusPriv: "true"
      FTLCONF_database_maxDBdays: "30"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
      FTLCONF_misc_etc_dnsmasq_d: "true"
      FTLCONF_webserver_port: "80"
      FTLCONF_dhcp_active: "false"
    volumes:
      - /srv/data/core-pihole/etc-pihole:/etc/pihole
      - /srv/data/core-pihole/dnsmasq.d:/etc/dnsmasq.d:ro
    mem_limit: 512m
    oom_score_adj: -800
networks:
  dns: { external: true }
