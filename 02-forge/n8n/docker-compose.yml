# n8n: 127.0.0.1:5678 -> Caddy n8n.homelab.internal (Mac only). Updated 2026-10-08.
name: forge-n8n

services:
  n8n:
    image: n8nio/n8n:2.43.5@sha256:4fc4c67bf5fb990201a71d94c7070abf8dd0619cb8af1d059877a447f3640392
    container_name: forge-n8n
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_PORT=5678
      - N8N_HOST=n8n.homelab.internal
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.homelab.internal/
      - N8N_EDITOR_BASE_URL=https://n8n.homelab.internal/
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g  # 2026-10-21: E1 content factory (8 Claude video calls) OOM at 1g
    networks:
      - default
      - homelab-apps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  homelab-apps:
    external: true
